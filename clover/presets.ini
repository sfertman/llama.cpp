version = 1

; Clover-35B-A3B + DFlash draft, two speculative profiles chosen by the request's "model" field.
; Start from the repo root (paths are relative to it):
;   build/bin/llama-server --models-preset clover/presets.ini --models-max 1 --host 0.0.0.0 --port 9080

[*]
model             = ../clover/Clover-35B-A3B-Preview-Q4_K_M.gguf
spec-draft-model  = drafts/dflash-Qwen3.6-35B-A3B-Q8_0-q4k-head.gguf
spec-type         = draft-dflash
spec-draft-ngl    = 99
n-gpu-layers      = 99
ctx-size          = 32768
ubatch-size       = 1024
parallel          = 1
flash-attn        = on
cache-type-k      = bf16
cache-type-v      = bf16
temp              = 0

; chat, prose, thinking: short fixed drafts
[clover-chat]
spec-draft-n-max  = 3
load-on-startup   = true

; code and summaries: longer drafts, cut when the draft is unsure
[clover-code]
spec-draft-n-max  = 7
spec-draft-p-min  = 0.35
